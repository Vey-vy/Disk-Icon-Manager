name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build
        run: |
          pyinstaller `
            --clean `
            --onefile `
            --windowed `
            --name "Disk Icon Maker" `
            --icon "assets/app.ico" `
            src/app.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Disk Icon Maker v${{ github.run_number }}"
          body: |
            ## Disk Icon Maker

            Windows executable built automatically from commit `${{ github.sha }}`.

            ### Download
            - `Disk Icon Maker.exe`
          files: "dist/Disk Icon Maker.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}