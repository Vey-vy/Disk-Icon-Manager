name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build
        run: |
          pyinstaller `
            --clean `
            --onefile `
            --windowed `
            --name "Disk Icon Maker" `
            --icon "assets/app.ico" `
            src/app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Disk-Icon-Maker-Windows
          path: "dist/Disk Icon Maker.exe"
